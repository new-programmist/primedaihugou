<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Prime Card Generator</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    h1 { color: #333; }
    textarea, input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; }
    .prime { background: #fff; padding: 10px; margin: 5px 0; border-left: 5px solid #4CAF50; }
    button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>素数カード生成器 🎴（0721(0始まり)対応）</h1>
  <label>カード数字（スペース区切り、例: 01 02 11 03）:</label>
  <input type="text" id="cards" value="12 12 11 11 10 10 01 01" />

  <label>繰り返し試行回数:</label>
  <input type="number" id="iterations" value="1000" />

  <label>使用枚数（min-max）例: 3-6:</label>
  <input type="text" id="lengthRange" value="3-6" />

  <button onclick="generate()">素数を探す</button>

  <h2>結果:</h2>
  <div id="result"></div>

  <script>
    function millerRabin(inputN, k = 10) {
      const n = BigInt(inputN);
      if (n < 2n) return false;
      if (n !== 2n && n % 2n === 0n) return false;

      let d = n - 1n;
      let r = 0;
      while (d % 2n === 0n) {
        d /= 2n;
        r += 1;
      }

      outer: for (let i = 0; i < k; i++) {
        const a = BigInt(Math.floor(Math.random() * Number(n - 4n)) + 2);
        let x = modPow(a, d, n);
        if (x === 1n || x === n - 1n) continue;

        for (let j = 0; j < r - 1; j++) {
          x = modPow(x, 2n, n);
          if (x === n - 1n) continue outer;
        }
        return false;
      }
      return true;
    }

    function modPow(base, exponent, mod) {
      let result = 1n;
      base = base % mod;
      while (exponent > 0n) {
        if (exponent % 2n === 1n)
          result = (result * base) % mod;
        exponent >>= 1n;
        base = (base * base) % mod;
      }
      return result;
    }

    function generate() {
      const cards = document.getElementById("cards").value.trim().split(/\s+/); // ← 数字文字列として保持
      const iterations = parseInt(document.getElementById("iterations").value);
      const [min, max] = document.getElementById("lengthRange").value.split("-").map(Number);
      const found = new Set();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";

      for (let i = 0; i < iterations; i++) {
        const shuffled = cards.slice().sort(() => Math.random() - 0.5);
        const len = Math.floor(Math.random() * (max - min + 1)) + min;
        const chosen = shuffled.slice(0, len);
        const numStr = chosen.join(""); // 文字列として連結（0を保持しない）
        const num = BigInt(numStr);
        if (millerRabin(num)) {
          found.add(`${chosen.join(" ")} → ${num}`);
        }
      }

      const sorted = Array.from(found).sort((a, b) => {
        const na = BigInt(a.split("→")[1].trim());
        const nb = BigInt(b.split("→")[1].trim());
        return na < nb ? -1 : 1;
      });

      for (const line of sorted) {
        const div = document.createElement("div");
        div.className = "prime";
        div.textContent = line;
        resultDiv.appendChild(div);
      }
    }
  </script>
</body>
</html>
